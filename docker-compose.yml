services:
  client:
    build: .
    volumes:
      - ./:/mnt
      - gems_bin:/usr/local/bin
      - gems:/usr/local/lib/ruby/gems/3.3.8
    profiles:
      - extra
  mysql:
    platform: linux/amd64
    image: mysql:8.0.42
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
volumes:
  gems_bin:
  gems:
